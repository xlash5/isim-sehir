name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
        name: Type check

      - run: npm test
        name: Unit tests

      - run: npm run build
        name: Build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            node_modules/.cache/vitest/
          retention-days: 7
